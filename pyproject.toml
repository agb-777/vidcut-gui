[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vidcut"
dynamic = ["version"]
description = "Fast, keyframe-aware video cutter (PySide6 + FFmpeg)"
requires-python = ">=3.9"
dependencies = ["PySide6>=6.5"]

[project.gui-scripts]
vidcut = "vidcut.app:main"

[tool.setuptools.packages.find]
include = ["vidcut*"]

[tool.setuptools.dynamic]
version = { attr = "vidcut.appinfo.VERSION" }
